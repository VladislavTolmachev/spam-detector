name: Notebook static checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/learning-friendly-cleanup]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run notebook static checks
        run: python -m pytest -q
